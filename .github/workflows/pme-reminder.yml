name: PME Incomplete Reminder

on:
  schedule:
    # 01:00 UTC = 09:00 MYT (UTC+8). Adjust if a different send time is wanted.
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call PME reminder endpoint
        run: curl -fsS "${{ vars.LDMS_BASE_URL }}/scripts/notify_pme_incomplete.php?key=${{ secrets.PME_REMINDER_KEY }}"
