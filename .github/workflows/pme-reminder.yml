name: PME Incomplete Reminder

# Not on a schedule: portal2.phn.com.my is behind Cloudflare with Bot Fight
# Mode on, which challenges/blocks GitHub-hosted runners' datacenter IPs
# (confirmed via a real run - got Cloudflare's "Just a moment" 403, not the
# script). The actual daily trigger is Windows Task Scheduler on a normal
# (non-datacenter-IP) server instead - see scripts/notify_pme_incomplete.php
# for the URL. Kept here, manual-only, as a fallback you can try again if
# Cloudflare's settings change (e.g. Bot Fight Mode gets turned off).
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call PME reminder endpoint
        env:
          PME_REMINDER_KEY: ${{ secrets.PME_REMINDER_KEY }}
        run: |
          KEY=$(printf '%s' "$PME_REMINDER_KEY" | tr -d '[:space:]')
          curl -fsS "${{ vars.LDMS_BASE_URL }}/scripts/notify_pme_incomplete.php?key=$KEY"
